# Builds Windows: tests on Windows, packages tttlog.exe with PyInstaller, checks it starts,
# then builds and test-installs tttlog-<version>-windows-setup.exe (Inno Setup).
# Uploads the installer and the no-install zip.
# Download it from the run's "Artifacts" section on GitHub.
name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # used by release.yml when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history: the build number is the commit count

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Antivirus (Defender's "Wacatac" and the like) often flags the launcher every
      # PyInstaller app shares, not the app itself. Compile our own from PyInstaller's
      # source instead of using the pre-built one from PyPI (MSVC is on the runner).
      - name: PyInstaller with a launcher built here
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller --no-cache-dir pyinstaller

      - name: Check the launcher was built here, not downloaded
        shell: python
        run: |
          import glob, hashlib, os, time, PyInstaller
          exes = glob.glob(os.path.join(os.path.dirname(PyInstaller.__file__), "bootloader", "Windows-64bit*", "run*.exe"))
          assert exes, "no Windows bootloader found"
          for e in exes:
              age = time.time() - os.path.getmtime(e)
              print(f"{os.path.basename(e)}  {hashlib.sha256(open(e, 'rb').read()).hexdigest()[:16]}  built {age / 60:.0f} min ago")
              assert age < 3 * 3600, f"{e} wasn't compiled in this run"

      - name: Last good country file (used if the download is blocked)
        uses: actions/cache@v6
        with:
          path: data/cty.dat
          key: cty-${{ github.run_id }}
          restore-keys: cty-

      - name: Latest country file
        run: python scripts/update_cty.py

      - name: Super Check Partial file (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.supercheckpartial.com/MASTER.SCP -OutFile data/MASTER.SCP -TimeoutSec 60
          if (Select-String -Path data/MASTER.SCP -Pattern '<html' -Quiet) { Write-Output "::warning::Got a web page, not MASTER.SCP"; Remove-Item data/MASTER.SCP }

      - name: Tests (on Windows)
        run: python -m pytest -q

      - name: Build tttlog.exe
        run: python scripts/build_app.py

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $p = Start-Process dist\tttlog\tttlog.exe -ArgumentList "--smoke-test" -Wait -PassThru `
               -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0) { throw "tttlog.exe smoke test failed (exit $($p.ExitCode))" }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = python -c "import runpy; print(runpy.run_path('tttlog/__init__.py')['__version__'])"
          $fv = python -c "import sys; sys.path.insert(0, 'scripts'); import build_app; print(build_app.file_version())"
          & $iscc /Q "/DAppVersion=$ver" "/DFileVersion=$fv" packaging\windows\tttlog.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*-setup.exe

      - name: Check the installer installs a working tttlog
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "installer failed (exit $($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\tttlog\tttlog.exe"
          if (-not (Test-Path $exe)) { Get-Content setup.log; throw "not installed at $exe" }
          $q = Start-Process $exe -ArgumentList "--smoke-test" -Wait -PassThru -RedirectStandardOutput inst.txt
          Get-Content inst.txt
          if ($q.ExitCode -ne 0) { throw "installed tttlog.exe failed its smoke test" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\tttlog\tttlog.lnk")) { throw "no Start menu entry" }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/tttlog-*-windows-setup.exe
          retention-days: 30

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          # As-is, not zipped again: the download is the versioned file itself
          # (one unzip on Windows, not two). The file name is the artifact name.
          archive: false
          path: dist/tttlog-*-windows.zip
          retention-days: 30
