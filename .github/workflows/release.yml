name: release
# Push a tag like v0.2.0 -> builds Mac (Apple Silicon + Intel), Windows, Linux and publishes a GitHub Release.
# The in-app updater (Help > Check for updates) reads these releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
          - os: macos-15-intel    # Intel Macs
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      TTTLOG_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev,build]"
      - run: pytest -q
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tttlog-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
