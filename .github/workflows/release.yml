# Publish a release on GitHub (Releases > Draft a new release, tag e.g. v0.1.0a3,
# "Set as a pre-release" for alphas) -> this builds Mac (Apple Silicon + Intel),
# Windows and Linux and attaches them to that release.
# The in-app updater (Help > Check for updates) reads these releases.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mac:
    uses: ./.github/workflows/mac-build.yml
  windows:
    uses: ./.github/workflows/windows-build.yml
  linux:
    uses: ./.github/workflows/linux-build.yml

  publish:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Attach builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber --repo "${{ github.repository }}"
