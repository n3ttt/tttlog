# Builds the Linux alpha-test package: tests on Linux, packages tttlog with
# PyInstaller, wraps it in an AppImage, checks it starts, and uploads
# tttlog-<version>-linux-x86_64.tar.gz (AppImage + install-linux.sh).
# Built on an older Ubuntu so the AppImage runs on older distros too.
name: Linux build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      APPIMAGE_EXTRACT_AND_RUN: "1"     # no FUSE on the runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1 libdbus-1-3 file

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Latest country file
        run: python scripts/update_cty.py

      - name: Super Check Partial file (optional)
        continue-on-error: true
        run: curl -fsSL --max-time 60 -o data/MASTER.SCP https://www.supercheckpartial.com/MASTER.SCP

      - name: Tests (on Linux)
        run: python -m pytest -q

      - name: Build
        run: python scripts/build_app.py

      - name: Check the program starts
        run: ./dist/tttlog/tttlog --smoke-test

      - name: AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" sh scripts/build_appimage.sh

      - name: Check the AppImage starts
        run: ./dist/tttlog-*-x86_64.AppImage --smoke-test

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: tttlog-linux
          path: dist/tttlog-*-linux-x86_64.tar.gz
          retention-days: 30
